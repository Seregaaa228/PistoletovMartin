version = '1.7.0'
base { archivesName = 'frontier-arcade-vehicles' }
sourceSets.main.java.exclude 'dev/frontier/arcade/smoke/**'
tasks.named('jar', Jar).configure {
    manifest.attributes 'MixinConfigs': 'frontier_arcade_vehicles.mixins.json'
    from('LICENSE.txt') { into 'META-INF'; rename { 'LICENSE.frontier-arcade' } }
}

tasks.register('warheadRulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.frontier.arcade.combat.WarheadRulesTest'
}
tasks.named('check').configure { dependsOn 'warheadRulesTest' }


tasks.register('vehicleBallisticsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.frontier.arcade.balance.VehicleBallisticsTest'
}
tasks.named('check').configure { dependsOn 'vehicleBallisticsTest' }

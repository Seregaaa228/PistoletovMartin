version = '1.3.0'
base { archivesName = 'frontier-flamingo-launch-fix' }

// Deterministic collision/launch probes use the pinned native geometry, without a game world.
tasks.register('nativeGeometryProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.frontier.flamingofix.NativeGeometryProbe'
}
tasks.named('check').configure { dependsOn 'nativeGeometryProbe' }
tasks.register('trailCadenceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.frontier.flamingofix.TrailCadenceTest'
}
tasks.named('check').configure { dependsOn 'trailCadenceTest' }
tasks.register('directImpactProfileTest', JavaExec) {
